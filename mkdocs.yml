site_name: 神经网络史话
site_description: 从感知机到 ChatGPT
site_url: https://terie412.github.io/qtc-llm-story/
repo_url: https://github.com/Terie412/qtc-llm-story
repo_name: Terie412/qtc-llm-story
copyright: 从感知机到 ChatGPT

docs_dir: docs
site_dir: site
use_directory_urls: false
extra_css:
  - assets/extra.css

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 2

nav:
